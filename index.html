<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nakupovalni Listek">
    <title>Nakupovalni Listek</title>
    <link rel="manifest" href="shopping-manifest.json">
    <link rel="icon" type="image/png" href="shopping-icon-192.png">
    <link rel="apple-touch-icon" href="shopping-icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            min-height: 100vh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #059669;
            font-size: 28px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
        }

        .add-item-box {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        #itemInput {
            flex: 1;
            padding: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            background: #f9fafb;
            transition: all 0.3s;
        }

        #itemInput:focus {
            outline: none;
            border-color: #10b981;
            background: white;
        }

        .btn {
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-add {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .btn-add:active {
            transform: scale(0.98);
        }

        .btn-share {
            background: #3b82f6;
            color: white;
            width: 100%;
            margin-top: 15px;
        }

        .btn-clear {
            background: #ef4444;
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        .list-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        .list-title {
            font-size: 18px;
            font-weight: 700;
            color: #059669;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .item-count {
            background: #10b981;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .shopping-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            margin-bottom: 10px;
            border-radius: 12px;
            background: #f0fdf4;
            border-left: 4px solid #10b981;
            transition: all 0.3s;
        }

        .shopping-item.checked {
            background: #f3f4f6;
            border-left-color: #9ca3af;
            opacity: 0.7;
        }

        .checkbox {
            width: 28px;
            height: 28px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .item-text {
            flex: 1;
            font-size: 16px;
            color: #1f2937;
            font-weight: 500;
            word-break: break-word;
        }

        .item-text.checked {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #9ca3af;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            opacity: 0.3;
        }

        .stats {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            flex: 1;
            background: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: #10b981;
        }

        .stat-label {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }

        .install-prompt {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: none;
            align-items: center;
            gap: 12px;
        }

        .install-prompt.show {
            display: flex;
        }

        .install-btn {
            background: white;
            color: #2563eb;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .quick-add {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 15px;
        }

        .quick-btn {
            background: #dbeafe;
            border: none;
            padding: 10px 8px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #1e40af;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-btn:active {
            transform: scale(0.95);
            background: #bfdbfe;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛒 Nakupovalni Listek</h1>
            <p class="subtitle">Tvoj digitalni seznam za nakupovanje</p>
        </div>

        <div class="install-prompt" id="installPrompt">
            <div style="flex: 1;">
                📱 Namesti aplikacijo za hitrejši dostop!
            </div>
            <button class="install-btn" id="installBtn">Namesti</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Skupaj</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="uncheckedCount">0</div>
                <div class="stat-label">Za kupit</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="checkedCount">0</div>
                <div class="stat-label">Kupljeno</div>
            </div>
        </div>

        <div class="add-item-box">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="itemInput" 
                    placeholder="Dodaj artikel... (npr. kruh, mleko)"
                    onkeypress="if(event.key==='Enter') addItem()"
                >
                <button class="btn btn-add" onclick="addItem()">➕</button>
            </div>

            <div class="quick-add">
                <button class="quick-btn" onclick="quickAdd('🍞 Kruh')">🍞 Kruh</button>
                <button class="quick-btn" onclick="quickAdd('🥛 Mleko')">🥛 Mleko</button>
                <button class="quick-btn" onclick="quickAdd('🧀 Sir')">🧀 Sir</button>
                <button class="quick-btn" onclick="quickAdd('🥚 Jajca')">🥚 Jajca</button>
                <button class="quick-btn" onclick="quickAdd('🍎 Sadje')">🍎 Sadje</button>
                <button class="quick-btn" onclick="quickAdd('🥬 Zelenjava')">🥬 Zelenjava</button>
            </div>

            <button class="btn btn-share" onclick="shareList()">📤 Deli Seznam</button>
            <button class="btn btn-clear" onclick="clearChecked()">🗑️ Pobriši kupljeno</button>
        </div>

        <div class="list-container">
            <div class="list-title">
                <span>📝 Moj Seznam</span>
                <span class="item-count" id="listCount">0</span>
            </div>
            <div id="shoppingList"></div>
        </div>
    </div>

    <script>
        let items = JSON.parse(localStorage.getItem('shoppingList') || '[]');
        let deferredPrompt;

        // PWA Install
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installPrompt').classList.add('show');
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                document.getElementById('installPrompt').classList.remove('show');
            }
        });

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('shopping-sw.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker failed'));
        }

        // Add item
        function addItem() {
            const input = document.getElementById('itemInput');
            const text = input.value.trim();
            
            if (text) {
                items.push({
                    id: Date.now(),
                    text: text,
                    checked: false,
                    timestamp: new Date().toISOString()
                });
                
                saveItems();
                input.value = '';
                renderList();
            }
        }

        // Quick add
        function quickAdd(text) {
            items.push({
                id: Date.now(),
                text: text,
                checked: false,
                timestamp: new Date().toISOString()
            });
            
            saveItems();
            renderList();
        }

        // Toggle check
        function toggleCheck(id) {
            const item = items.find(i => i.id === id);
            if (item) {
                item.checked = !item.checked;
                saveItems();
                renderList();
            }
        }

        // Delete item
        function deleteItem(id) {
            items = items.filter(i => i.id !== id);
            saveItems();
            renderList();
        }

        // Clear checked items
        function clearChecked() {
            const checkedCount = items.filter(i => i.checked).length;
            
            if (checkedCount === 0) {
                alert('Ni označenih artiklov za brisanje.');
                return;
            }
            
            if (confirm(`Izbriši ${checkedCount} kupljenih artiklov?`)) {
                items = items.filter(i => !i.checked);
                saveItems();
                renderList();
            }
        }

        // Save to localStorage
        function saveItems() {
            localStorage.setItem('shoppingList', JSON.stringify(items));
        }

        // Share list
        function shareList() {
            const uncheckedItems = items.filter(i => !i.checked);
            
            if (uncheckedItems.length === 0) {
                alert('Ni artiklov za deljenje!');
                return;
            }
            
            const text = '🛒 Nakupovalni Listek:\n\n' + 
                uncheckedItems.map(item => `• ${item.text}`).join('\n');
            
            if (navigator.share) {
                navigator.share({
                    title: 'Nakupovalni Listek',
                    text: text
                }).catch(err => console.log('Error sharing:', err));
            } else {
                // Fallback - copy to clipboard
                navigator.clipboard.writeText(text).then(() => {
                    alert('✅ Seznam skopiran v clipboard!\nLahko ga prilepiš v Messages.');
                }).catch(() => {
                    alert(text);
                });
            }
        }

        // Render list
        function renderList() {
            const container = document.getElementById('shoppingList');
            
            // Sort: unchecked first, then checked
            const sortedItems = [...items].sort((a, b) => {
                if (a.checked === b.checked) return 0;
                return a.checked ? 1 : -1;
            });
            
            if (sortedItems.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg fill="currentColor" viewBox="0 0 20 20">
                            <path d="M3 1a1 1 0 000 2h1.22l.305 1.222a.997.997 0 00.01.042l1.358 5.43-.893.892C3.74 11.846 4.632 14 6.414 14H15a1 1 0 000-2H6.414l1-1H14a1 1 0 00.894-.553l3-6A1 1 0 0017 3H6.28l-.31-1.243A1 1 0 005 1H3zM16 16.5a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zM6.5 18a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/>
                        </svg>
                        <div>Tvoj seznam je prazen</div>
                        <div style="font-size: 14px; margin-top: 8px;">Dodaj prvi artikel!</div>
                    </div>
                `;
            } else {
                container.innerHTML = sortedItems.map(item => `
                    <div class="shopping-item ${item.checked ? 'checked' : ''}">
                        <input 
                            type="checkbox" 
                            class="checkbox" 
                            ${item.checked ? 'checked' : ''} 
                            onchange="toggleCheck(${item.id})"
                        >
                        <div class="item-text ${item.checked ? 'checked' : ''}">
                            ${item.text}
                        </div>
                        <button class="delete-btn" onclick="deleteItem(${item.id})">
                            🗑️
                        </button>
                    </div>
                `).join('');
            }
            
            updateStats();
        }

        // Update statistics
        function updateStats() {
            const total = items.length;
            const checked = items.filter(i => i.checked).length;
            const unchecked = total - checked;
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('checkedCount').textContent = checked;
            document.getElementById('uncheckedCount').textContent = unchecked;
            document.getElementById('listCount').textContent = total;
        }

        // Initialize
        renderList();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛒 Nakupovalni Listek v2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #10b981;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
        }

        .history-badge {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 10px;
        }

        .total-box {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(245, 158, 11, 0.3);
        }

        .total-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .total-amount {
            font-size: 36px;
            font-weight: 800;
        }

        .stats {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .stat-item {
            flex: 1;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 20px;
            font-weight: 700;
        }

        .stat-label {
            font-size: 11px;
            opacity: 0.9;
            margin-top: 3px;
        }

        .input-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-wrapper {
            flex: 1;
        }

        .input-label {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 5px;
        }

        .item-input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            background: #f9fafb;
            transition: all 0.3s;
        }

        .price-input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            background: #f9fafb;
            text-align: right;
        }

        .item-input:focus, .price-input:focus {
            outline: none;
            border-color: #10b981;
            background: white;
        }

        .add-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .add-btn:active {
            transform: scale(0.98);
        }

        .quick-add {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .quick-add-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding: 5px;
        }

        .quick-add-title {
            font-size: 16px;
            font-weight: 700;
            color: #374151;
        }

        .toggle-icon {
            font-size: 20px;
            transition: transform 0.3s;
        }

        .toggle-icon.open {
            transform: rotate(180deg);
        }

        .quick-list {
            display: none;
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
        }

        .quick-list.open {
            display: block;
        }

        .quick-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #f3f4f6;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-item:last-child {
            border-bottom: none;
        }

        .quick-item:hover {
            background: #f9fafb;
        }

        .quick-item:active {
            background: #10b981;
            color: white;
        }

        .quick-item-name {
            font-size: 15px;
            font-weight: 500;
        }

        .quick-item-price {
            font-size: 14px;
            font-weight: 700;
            color: #10b981;
        }

        .quick-item:active .quick-item-price {
            color: white;
        }

        .search-box {
            margin-bottom: 10px;
        }

        .search-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
        }

        .search-input:focus {
            outline: none;
            border-color: #10b981;
        }

        .items-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #374151;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .clear-bought-btn {
            padding: 8px 16px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .share-btn {
            padding: 8px 16px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            background: #f9fafb;
            border-radius: 10px;
            margin-bottom: 8px;
            transition: all 0.3s;
        }

        .item.checked {
            opacity: 0.6;
            background: #f3f4f6;
        }

        .item.checked .item-text {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .item.editing {
            background: #ecfdf5;
            border: 2px solid #10b981;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .item-content {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .item-text {
            font-size: 16px;
            color: #1f2937;
            font-weight: 500;
        }

        .item-price {
            font-size: 16px;
            font-weight: 700;
            color: #10b981;
            cursor: pointer;
        }

        .item.checked .item-price {
            color: #9ca3af;
        }

        .price-edit-input {
            width: 80px;
            padding: 6px;
            border: 2px solid #10b981;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            text-align: right;
            background: white;
        }

        .price-edit-input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        .edit-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            flex-shrink: 0;
        }

        .save-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            flex-shrink: 0;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            flex-shrink: 0;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #9ca3af;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛒 Nakupovalni Listek</h1>
            <p class="subtitle">
                Z cenami in skupnim seštevkom
                <span class="history-badge" id="historyBadge">💾 0 v zgodovini</span>
            </p>
        </div>

        <div class="total-box">
            <div class="total-label">💰 SKUPAJ CENA</div>
            <div class="total-amount" id="totalPrice">0.00 €</div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalItems">0</div>
                    <div class="stat-label">Skupaj</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="toBuyItems">0</div>
                    <div class="stat-label">Za kupit</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="boughtItems">0</div>
                    <div class="stat-label">Kupljeno</div>
                </div>
            </div>
        </div>

        <div class="input-section">
            <div class="input-row">
                <div class="input-wrapper" style="flex: 2;">
                    <div class="input-label">Artikel</div>
                    <input 
                        type="text" 
                        class="item-input" 
                        id="itemInput" 
                        placeholder="Npr. Kruh"
                        onkeypress="if(event.key==='Enter') addItem()"
                    >
                </div>
                <div class="input-wrapper" style="flex: 1;">
                    <div class="input-label">Cena (€)</div>
                    <input 
                        type="number" 
                        step="0.01"
                        class="price-input" 
                        id="priceInput" 
                        placeholder="0.00"
                        onkeypress="if(event.key==='Enter') addItem()"
                    >
                </div>
            </div>
            <button class="add-btn" onclick="addItem()">➕ Dodaj</button>
        </div>

        <div class="quick-add">
            <div class="quick-add-header" onclick="toggleQuickList()">
                <span class="quick-add-title">⚡ Hitro dodaj (50 artiklov)</span>
                <span class="toggle-icon" id="toggleIcon">▼</span>
            </div>
            <div class="quick-list" id="quickList">
                <div class="search-box">
                    <input 
                        type="text" 
                        class="search-input" 
                        id="quickSearch" 
                        placeholder="🔍 Išči artikel..."
                        oninput="filterQuickList()"
                    >
                </div>
                <div id="quickItemsList"></div>
            </div>
        </div>

        <div class="items-section">
            <div class="section-header">
                <span class="section-title">📝 Moj seznam</span>
                <div class="action-buttons">
                    <button class="share-btn" onclick="shareList()">📤 Deli</button>
                    <button class="clear-bought-btn" onclick="clearBought()">🗑️ Pobriši kupljeno</button>
                </div>
            </div>
            <div id="itemsList"></div>
        </div>
    </div>

    <script>
        let items = JSON.parse(localStorage.getItem('shoppingItemsV2') || '[]');
        let priceHistory = JSON.parse(localStorage.getItem('priceHistory') || '{}');

        // 50 predefined items with prices
        const predefinedItems = [
            { name: '🍞 Kruh', price: 1.50 },
            { name: '🥛 Mleko', price: 0.99 },
            { name: '🧀 Sir', price: 3.50 },
            { name: '🥚 Jajca', price: 2.20 },
            { name: '🍎 Jabolko', price: 0.60 },
            { name: '🍌 Banana', price: 0.40 },
            { name: '🍊 Pomaranča', price: 0.50 },
            { name: '🥬 Solata', price: 1.80 },
            { name: '🥕 Korenje', price: 0.80 },
            { name: '🧅 Čebula', price: 0.70 },
            { name: '🥔 Krompir', price: 1.20 },
            { name: '🍅 Paradižnik', price: 1.50 },
            { name: '🥒 Kumara', price: 0.90 },
            { name: '🌶️ Paprika', price: 1.30 },
            { name: '🥦 Brokoli', price: 2.10 },
            { name: '🍗 Piščanec', price: 5.50 },
            { name: '🥩 Govedina', price: 8.90 },
            { name: '🥓 Slanina', price: 4.20 },
            { name: '🍖 Svinjina', price: 6.50 },
            { name: '🐟 Riba', price: 7.80 },
            { name: '🍤 Kozice', price: 9.50 },
            { name: '🧈 Maslo', price: 2.80 },
            { name: '🥐 Croissant', price: 1.20 },
            { name: '🍪 Piškoti', price: 2.50 },
            { name: '🍫 Čokolada', price: 1.80 },
            { name: '🍰 Torta', price: 12.00 },
            { name: '🍕 Pizza', price: 5.50 },
            { name: '🍝 Testenine', price: 1.90 },
            { name: '🍚 Riž', price: 2.30 },
            { name: '🥫 Konzerva', price: 1.50 },
            { name: '🍯 Med', price: 4.50 },
            { name: '🥜 Oreščki', price: 3.20 },
            { name: '☕ Kava', price: 5.80 },
            { name: '🍵 Čaj', price: 3.50 },
            { name: '🧃 Sok', price: 1.80 },
            { name: '🥤 Coca Cola', price: 1.50 },
            { name: '🍺 Pivo', price: 1.20 },
            { name: '🍷 Vino', price: 6.50 },
            { name: '💧 Voda', price: 0.50 },
            { name: '🧻 WC papir', price: 3.50 },
            { name: '🧼 Milo', price: 1.80 },
            { name: '🧴 Šampon', price: 4.20 },
            { name: '🪥 Zobna pasta', price: 2.90 },
            { name: '🧽 Goba', price: 1.20 },
            { name: '🧹 Metla', price: 5.50 },
            { name: '🧺 Pralni prašek', price: 8.90 },
            { name: '🕯️ Svečke', price: 3.20 },
            { name: '💡 Žarnica', price: 4.50 },
            { name: '🔋 Baterije', price: 5.20 },
            { name: '📰 Časopis', price: 1.50 }
        ];

        function toggleQuickList() {
            const list = document.getElementById('quickList');
            const icon = document.getElementById('toggleIcon');
            
            list.classList.toggle('open');
            icon.classList.toggle('open');
        }

        function renderQuickList(filteredItems = predefinedItems) {
            const container = document.getElementById('quickItemsList');
            
            container.innerHTML = filteredItems.map(item => `
                <div class="quick-item" onclick="quickAdd('${item.name}', ${item.price})">
                    <span class="quick-item-name">${item.name}</span>
                    <span class="quick-item-price">${item.price.toFixed(2)}€</span>
                </div>
            `).join('');
        }

        function filterQuickList() {
            const search = document.getElementById('quickSearch').value.toLowerCase();
            const filtered = predefinedItems.filter(item => 
                item.name.toLowerCase().includes(search)
            );
            renderQuickList(filtered);
        }

        // Auto-suggest price when typing item name
        document.addEventListener('DOMContentLoaded', function() {
            const itemInput = document.getElementById('itemInput');
            const priceInput = document.getElementById('priceInput');
            
            itemInput.addEventListener('input', function() {
                const text = this.value.trim().toLowerCase();
                
                // Search for matching item in history
                for (let [itemName, itemPrice] of Object.entries(priceHistory)) {
                    if (itemName.toLowerCase().includes(text) && text.length > 2) {
                        priceInput.value = itemPrice;
                        priceInput.style.borderColor = '#10b981';
                        priceInput.style.background = '#f0fdf4';
                        return;
                    }
                }
            });
        });

        function addItem() {
            const text = document.getElementById('itemInput').value.trim();
            const price = parseFloat(document.getElementById('priceInput').value) || 0;

            if (!text) return;

            // Save to price history
            priceHistory[text] = price;
            localStorage.setItem('priceHistory', JSON.stringify(priceHistory));

            items.push({
                id: Date.now(),
                text: text,
                price: price,
                checked: false
            });

            document.getElementById('itemInput').value = '';
            document.getElementById('priceInput').value = '';
            document.getElementById('priceInput').style.borderColor = '#e5e7eb';
            document.getElementById('priceInput').style.background = '#f9fafb';
            document.getElementById('itemInput').focus();

            render();
        }

        function quickAdd(text, price) {
            items.push({
                id: Date.now(),
                text: text,
                price: price,
                checked: false
            });
            render();
        }

        function toggleItem(id) {
            const item = items.find(i => i.id === id);
            if (item) {
                item.checked = !item.checked;
                render();
            }
        }

        function editItem(id) {
            const item = items.find(i => i.id === id);
            if (item) {
                item.editing = true;
                render();
                // Focus on the input
                setTimeout(() => {
                    const input = document.getElementById(`price-input-${id}`);
                    if (input) {
                        input.focus();
                        input.select();
                    }
                }, 50);
            }
        }

        function saveEdit(id) {
            const item = items.find(i => i.id === id);
            if (item) {
                const input = document.getElementById(`price-input-${id}`);
                const newPrice = parseFloat(input.value) || 0;
                item.price = newPrice;
                item.editing = false;
                
                // Update price history
                priceHistory[item.text] = newPrice;
                localStorage.setItem('priceHistory', JSON.stringify(priceHistory));
                
                render();
            }
        }

        function cancelEdit(id) {
            const item = items.find(i => i.id === id);
            if (item) {
                item.editing = false;
                render();
            }
        }

        function deleteItem(id) {
            items = items.filter(i => i.id !== id);
            render();
        }

        function clearBought() {
            if (confirm('Izbriši vse kupljene artikle?')) {
                items = items.filter(i => !i.checked);
                render();
            }
        }

        function shareList() {
            const uncheckedItems = items.filter(i => !i.checked);
            const checkedItems = items.filter(i => i.checked);
            
            let text = '🛒 Nakupovalni Listek\n\n';
            
            if (uncheckedItems.length > 0) {
                text += '📝 ZA KUPIT:\n';
                uncheckedItems.forEach(item => {
                    text += `• ${item.text}`;
                    if (item.price > 0) text += ` - ${item.price.toFixed(2)}€`;
                    text += '\n';
                });
            }
            
            if (checkedItems.length > 0) {
                text += '\n✅ KUPLJENO:\n';
                checkedItems.forEach(item => {
                    text += `• ${item.text}`;
                    if (item.price > 0) text += ` - ${item.price.toFixed(2)}€`;
                    text += '\n';
                });
            }

            const total = items.reduce((sum, item) => sum + item.price, 0);
            text += `\n💰 SKUPAJ: ${total.toFixed(2)}€`;

            if (navigator.share) {
                navigator.share({
                    title: 'Nakupovalni Listek',
                    text: text
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(text).then(() => {
                    alert('✅ Seznam skopiran! Lahko ga prilepiš v Messages.');
                });
            }
        }

        function render() {
            const container = document.getElementById('itemsList');
            
            // Save to localStorage
            localStorage.setItem('shoppingItemsV2', JSON.stringify(items));
            
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🛒</div>
                        <div>Tvoj seznam je prazen</div>
                        <div style="font-size: 13px; margin-top: 5px;">Dodaj prvi artikel!</div>
                    </div>
                `;
            } else {
                const unchecked = items.filter(i => !i.checked);
                const checked = items.filter(i => i.checked);
                const sorted = [...unchecked, ...checked];

                container.innerHTML = sorted.map(item => `
                    <div class="item ${item.checked ? 'checked' : ''} ${item.editing ? 'editing' : ''}">
                        <input 
                            type="checkbox" 
                            class="checkbox" 
                            ${item.checked ? 'checked' : ''} 
                            onchange="toggleItem(${item.id})"
                            ${item.editing ? 'disabled' : ''}
                        >
                        <div class="item-content">
                            <span class="item-text">${escapeHtml(item.text)}</span>
                            ${item.editing ? `
                                <input 
                                    type="number" 
                                    step="0.01" 
                                    class="price-edit-input" 
                                    id="price-input-${item.id}"
                                    value="${item.price.toFixed(2)}"
                                    onkeypress="if(event.key==='Enter') saveEdit(${item.id})"
                                >
                            ` : `
                                <span class="item-price" onclick="editItem(${item.id})" title="Klikni za urejanje">
                                    ${item.price > 0 ? item.price.toFixed(2) + '€' : ''}
                                </span>
                            `}
                        </div>
                        ${item.editing ? `
                            <button class="save-btn" onclick="saveEdit(${item.id})">✓ Shrani</button>
                            <button class="delete-btn" onclick="cancelEdit(${item.id})">✕</button>
                        ` : `
                            <button class="edit-btn" onclick="editItem(${item.id})">✏️</button>
                            <button class="delete-btn" onclick="deleteItem(${item.id})">🗑️</button>
                        `}
                    </div>
                `).join('');
            }

            // Update stats
            const total = items.reduce((sum, item) => sum + item.price, 0);
            const toBuy = items.filter(i => !i.checked).length;
            const bought = items.filter(i => i.checked).length;

            document.getElementById('totalPrice').textContent = total.toFixed(2) + ' €';
            document.getElementById('totalItems').textContent = items.length;
            document.getElementById('toBuyItems').textContent = toBuy;
            document.getElementById('boughtItems').textContent = bought;
            
            // Update history badge
            const historyCount = Object.keys(priceHistory).length;
            document.getElementById('historyBadge').textContent = `💾 ${historyCount} v zgodovini`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize
        renderQuickList();
        render();
    </script>
</body>
</html>
